name: SentinelX agent tests

on:
  push:
    branches: [main, cross-platform-v1]
  pull_request:
    branches: [main]

jobs:
  agent-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install agent dependencies
        run: python -m pip install -r agent/requirements.txt
      - name: Run collector tests
        working-directory: agent
        run: python -m unittest discover -v

  server-ingestion-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install server dependencies
        run: python -m pip install -r requirements.txt
      - name: Test API ingestion and batch idempotency
        run: python -m unittest server.test_ingestion server.test_auth -v

name: SentinelX agent tests

on:
  push:
    branches: [main, cross-platform-v1, release-hardening-v1]
  pull_request:
    branches: [main, release-hardening-v1]

jobs:
  agent-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check central API Python syntax
        run: python -m py_compile server/main.py
      - name: Check dashboard JavaScript syntax
        run: node --check dashboard/app.js
      - name: Install agent dependencies
        run: python -m pip install -r agent/requirements.txt
      - name: Run collector tests
        working-directory: agent
        run: python -m unittest discover -v

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SentinelX | Administrator login</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#08111f;color:#e8f0fb;font:15px system-ui,sans-serif;padding:24px}.panel{width:min(420px,100%);padding:36px;background:#0d1a2b;border:1px solid #263951;border-radius:18px;box-shadow:0 20px 70px #0008}.brand{font-size:24px;font-weight:800;margin-bottom:8px}.sub{color:#9fb2ca;line-height:1.6;margin-bottom:26px}label{display:block;color:#a9bad0;font-size:13px;margin:16px 0 7px}input{width:100%;padding:13px;background:#091523;border:1px solid #2a4059;border-radius:9px;color:#fff;font-size:15px}button{width:100%;padding:13px;margin-top:22px;background:#42c9bd;color:#06202a;border:0;border-radius:9px;font-weight:800;cursor:pointer}button:disabled{opacity:.6}.msg{min-height:20px;color:#ffb1b7;font-size:13px;margin-top:14px}.note{font-size:12px;color:#91a7c1;line-height:1.6;margin-top:22px}
</style></head><body><main class="panel"><div class="brand">SentinelX</div><div class="sub">Self-hosted infrastructure operations<br>Sign in with your local administrator account.</div><form id="login"><label for="username">Administrator username</label><input id="username" autocomplete="username" value="admin" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button id="submit">Sign in</button></form><div id="message" class="msg" role="alert"></div><p class="note">Credentials are stored only on this SentinelX installation. If this is a fresh installation, configure SENTINELX_ADMIN_PASSWORD before starting the API.</p></main>
<script>
document.getElementById("login").addEventListener("submit",async e=>{e.preventDefault();const b=document.getElementById("submit"),m=document.getElementById("message");b.disabled=true;m.textContent="";try{const r=await fetch("/api/v1/auth/login",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:document.getElementById("username").value,password:document.getElementById("password").value})});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.detail||"Sign in failed");location.replace("/dashboard/")}catch(err){m.textContent=err.message}finally{b.disabled=false}});
</script></body></html>
